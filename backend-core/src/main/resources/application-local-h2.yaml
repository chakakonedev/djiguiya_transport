# Profile for local run without MySQL: --spring.profiles.active=local-h2
spring:
  datasource:
    url: jdbc:h2:file:./data/djiguiya;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

# H2 dependency must be on classpath (already test scope — add runtime for this profile via optional or use test classpath).
