spring:
  datasource:
    url: jdbc:h2:mem:djiguiya_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

djiguiya:
  jwt:
    secret: TestSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmac!!
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  security:
    cors-allowed-origins: http://localhost:4200
